application:
  subdomain: sdcb-chats
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://chats:8080/

services:
  chats:
    # upstream: sdcb/chats:1.9.0
    image: sdcb/chats:1.9.0
    environment:
      - DBType=sqlite
    binds:
      - /lzcapp/var/data:/app/AppData
    setup_script: |
      echo "Setting up..."
      chmod 755 /app/AppData
