application:
  subdomain: sdcb-chats
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://chats:8080/
services:
  chats:
    # upstream: sdcb/chats:1.17.0
    image: registry.lazycat.cloud/czyt/sdcb/chats:41fee57a7b9d9a1b
    environment:
      - DBType=sqlite
    binds:
      - /lzcapp/var/data:/app/AppData
    setup_script: |
      echo "Setting up..."
      chmod 755 /app/AppData
