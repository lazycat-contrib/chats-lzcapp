min_os_version: 1.3.8
name: "Sdcb Chats"
package: community.lazycat.app.sdcb-chats
version: 1.9.0
description: "您的下一代 AI 聊天中枢"
homepage: https://github.com/sdcb/chats
author: sdcb
application:
  subdomain: sdcb-chats
  background_task: true
  public_path:
    - /

  upstreams:
    - location: /
      backend: http://chats:8080/

services:
  chats:
    # sdcb/chats:1.9.0
    image: registry.lazycat.cloud/czyt/sdcb/chats:1044e351bcec91d6
    container_name: chats
    environment:
      - DBType=sqlite
    binds:
      - /lzcapp/var/data:/app/AppData
    setup_script: |
      echo "Setting up..."
      chmod 755 /app/AppData

locales:
  zh:
    name: "Sdcb Chats"
    description: "您的下一代 AI 聊天中枢"
  en:
    name: "Sdcb Chats"
    description: "User-friendly Enterprise Ready AI Interface "
